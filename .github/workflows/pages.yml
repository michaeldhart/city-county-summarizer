name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-flight run finish rather than
# cancelling it mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Build from website/Gemfile.lock rather than actions/jekyll-build-pages,
      # which pins its own github-pages gem set (Jekyll 3.10) and would build
      # the site with a different Jekyll major than local preview uses.
      # The lockfile is the single source of truth for both.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Reads website/.ruby-version, the same interpreter local preview
          # uses, so there is one place to bump it.
          ruby-version: .ruby-version
          working-directory: website
          bundler-cache: true

      # JEKYLL_ENV is set explicitly: actions/jekyll-build-pages defaulted it to
      # production, but `jekyll build` on its own defaults to development, which
      # changes jekyll-seo-tag and minima output.
      - name: Build with Jekyll
        working-directory: website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

      # Pagefind crawls the built HTML and writes a sharded index to
      # _site/pagefind/. It runs after Jekyll, not as a plugin, so it is
      # unaffected by what Jekyll can and cannot load. Pinned so the index
      # format cannot shift under a deploy; ubuntu-latest ships Node already.
      - name: Build search index
        working-directory: website
        run: npx -y pagefind@1.5.2 --site _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

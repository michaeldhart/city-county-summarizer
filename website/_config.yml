# minima: chosen in Phase 5 after comparing against just-the-docs locally.
# just-the-docs' sidebar/search only work with its own hand-authored
# parent/nav_order front matter, which our manifest-driven body/meeting
# hierarchy doesn't use — it rendered an empty sidebar and non-functional
# search. minima has no such assumptions and renders our content cleanly.
theme: minima

# Set explicitly (rather than relying on GitHub Pages' build-time
# auto-detection) so absolute URLs — e.g. jekyll-feed's <link>/<id>
# elements — are correct in local preview too, not just CI.
url: "https://michaeldhart.github.io"
baseurl: "/city-county-summarizer"

title: Boone County & Belvidere Government Watch
description: >-
  Meeting recaps for local government in Boone County, Illinois — the county
  board and its committees, the City of Belvidere, School District 100, the
  park district, and the two conservation districts.

collections:
  bodies:
    output: true
  meetings:
    output: true

defaults:
  - scope:
      path: ""
      type: "bodies"
    values:
      layout: body
  - scope:
      path: ""
      type: "meetings"
    values:
      layout: meeting

# Publishes an Atom feed of all meeting pages at /feed/meetings.xml
# (jekyll-feed ships as a minima dependency already).
feed:
  collections:
    - meetings

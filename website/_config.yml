# minima: chosen in Phase 5 after comparing against just-the-docs locally.
# just-the-docs' sidebar/search only work with its own hand-authored
# parent/nav_order front matter, which our manifest-driven body/meeting
# hierarchy doesn't use — it rendered an empty sidebar and non-functional
# search. minima has no such assumptions and renders our content cleanly.
theme: minima

# Set explicitly (rather than relying on GitHub Pages' build-time
# auto-detection) so absolute URLs — e.g. jekyll-feed's <link>/<id>
# elements — are correct in local preview too, not just CI.
#
# No baseurl: belviderewire.com serves the site from its root. This was a
# project site under /city-county-summarizer/ until the domain was pointed at
# it, and GitHub redirects the old URLs. Every internal link already goes
# through `relative_url`, so they resolve to bare paths now — but note local
# preview moved with it, to http://localhost:4000/ rather than
# http://localhost:4000/city-county-summarizer/.
url: "https://belviderewire.com"
baseurl: ""

title: The Belvidere Wire
tagline: A first draft of the public record.

# Linked from the footer of every page. The code that writes the site is part
# of the disclosure, not a footnote to it.
repo_url: https://github.com/michaeldhart/city-county-summarizer

# Where readers reach a person: a form, since the corrections process is the
# main thing standing between this site and being wrong in public, and GitHub
# issues are the wrong front door for most of Belvidere. The footer's Contact
# link renders only when this is set, so leaving it empty breaks nothing.
contact_url: https://docs.google.com/forms/d/e/1FAIpQLScxpZW5UnwwEPaKGP5ls7szdGotiMh_0GA6FJIaHnRAG2WJiQ/viewform

# The person behind the publication, named in the footer. Deliberately NOT
# `author`, which jekyll-feed would stamp onto every entry in the feed — the
# dispatches have no human author, and the feed should not say otherwise. This
# is a maintainer credit for the project, not a byline on the writing.
#
# maintainer_url is for a personal site; the name links only once it is set.
maintainer: Michael D. Hart
maintainer_url: https://www.michaeldhart.com

# Read by jekyll-feed as the author of every entry. A publication authoring its
# own dispatches is the accurate claim — and without it each entry carried an
# empty <author><name></name>, which RFC 4287 does not allow. Note this is the
# publication, not a person: see `maintainer` above for why that distinction is
# kept.
author: The Belvidere Wire

# GoatCounter: the site code only, not the full URL — _includes/head.html builds
# https://<code>.goatcounter.com/count from it. Cookieless and with no personal
# data, so it needs no consent banner; what it does collect is disclosed on
# /method/, which is also gated on this key, so an un-instrumented build makes
# no claim either way.
goatcounter_code: thebelviderewire
description: >-
  Machine-written dispatches from every public meeting in Boone County,
  Illinois — 22 beats across six governments, filed from the official
  agenda, minutes and meeting video, with every source linked.

# minima builds its nav from every page carrying a title, in path order, which
# swept in the four per-government backgrounders and left Home stranded after
# them. Name the nav explicitly instead.
#
# about.md (/about/) is deliberately absent: /beats/ links to each government's
# backgrounder directly, so the hub page is no longer a destination anyone
# needs to navigate to. The page itself stays published — the URL is live, the
# four backgrounders hang off it, and `ccs summary` still rebuilds it.
header_pages:
  - index.md
  - beats.md
  - search.md
  - method.md

collections:
  bodies:
    output: true
  meetings:
    output: true
  # Back issues. Every `ccs front-page` run writes a numbered edition here and
  # copies the newest one to index.md, so the front page has a history rather
  # than being overwritten into nothing. output: true publishes them at
  # /issues/NNN/ — see issues.md for the archive listing.
  front_pages:
    output: true
    permalink: /issues/:name/

defaults:
  # Ordinary pages had no layout at all, so about.md and about/*.md were
  # rendering as bare HTML with no head, stylesheet or nav. `page` supplies the
  # site chrome and marks them for the search index. index.md sets its own
  # layout, which wins over this, and so stays out of the index — right, since
  # it is a list of links rather than content.
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: ""
      type: "bodies"
    values:
      layout: body
  - scope:
      path: ""
      type: "meetings"
    values:
      layout: meeting
  # Both a back issue and index.md render through `front-page`. Note it carries
  # no data-pagefind-body: an issue is entirely pointers to dispatches that are
  # already indexed, so indexing issues too would double every search result.
  - scope:
      path: ""
      type: "front_pages"
    values:
      layout: front-page
      archived: true

# The wire itself: an Atom feed of every dispatch at /feed/meetings.xml
# (jekyll-feed ships as a minima dependency already). The masthead and the
# feed are the same metaphor — see method.md.
feed:
  collections:
    - meetings
  # jekyll-feed ships 10. A `ccs` run can file a dozen dispatches at once, and
  # at 10 a reader who polls after such a run never sees the ones that fell off
  # the end — which is the one thing a wire must not do.
  posts_limit: 50

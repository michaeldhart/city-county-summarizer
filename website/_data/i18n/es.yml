search_h1: "Buscar en el archivo"
search_intro: "Aquí se buscan los despachos mismos, completos, junto con los antecedentes de cada gobierno y las páginas que explican cómo funciona esto. Las agendas, las actas y el video en los que se basan no están indexados, así que algo que se haya mencionado en una reunión no necesariamente aparecerá en el resumen escrito a partir de ella. Si un despacho se parece a lo que busca, ábralo: la lista de Recursos a su lado enlaza los documentos originales, que siempre están más cerca del registro que un resumen."

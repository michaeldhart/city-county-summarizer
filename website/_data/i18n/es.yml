issues_h1: "Números anteriores"
issues_standfirst: "Cada lunes por la mañana sale una edición nueva. Aquí está cada edición de The Belvidere Wire, de la más reciente a la más antigua. Cada una se conserva tal como se publicó: las notas con las que abrió, en el orden en que se publicaron. Al regenerar la portada se crea un número nuevo en lugar de sobrescribir el anterior."

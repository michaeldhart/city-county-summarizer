{%- assign list_id = site.listmonk_lists[page.lang] | default: site.listmonk_lists.en -%}
<form method="post" action="https://list.belviderewire.com/subscription/form" class="subscribe-form">
  <input type="hidden" name="nonce" value="" />
  <input type="hidden" name="l" value="{{ list_id }}" />
  <input type="email" name="email" required placeholder="{{ 'sub_placeholder' | t }}" aria-label="{{ 'sub_aria' | t }}" />
  <button type="submit">{{ 'sub_button' | t }}</button>
</form>
